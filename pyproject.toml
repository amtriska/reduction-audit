[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reduction-audit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["sympy==1.14.0"]
license = "CC0-1.0 AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*"]

[tool.setuptools]
packages = ["reduction_audit"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: the n=5, m=6 sweep instances; deselect with -m \"not slow\""]
